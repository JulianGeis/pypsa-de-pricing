  iiasa_database:
    reference_scenario: KN2045_Bal_v4
    fallback_reference_scenario: KN2045_Bal_v4
  co2_budget_DE_source: KSG

  costs:
    horizon: mean
    NEP: 2021
    transmission: overhead   # either overhead line ("overhead") or underground cable ("underground")
  solving:
    constraints:
      limits_capacity_min:
        Link:
          H2 Electrolysis:
            DE:
              2030: 5
      co2_budget_national:
        2020:
          DE: 0.671
        2025:
          DE: 0.523
        2030:
          DE: 0.346
        2035:
          DE: 0.216
        2040:
          DE: 0.09
        2045:
          DE: -0.05
        2050:
          DE: -0.048
  industry:
    steam_biomass_fraction: 0.4
    steam_hydrogen_fraction: 0.3
    steam_electricity_fraction: 0.3

    St_primary_fraction:
      2020: 0.7023
      2025: 0.705
      2030: 0.6929
      2035: 0.6598
      2040: 0.6273
      2045: 0.6047
    DRI_fraction:
      2020: 0.0
      2025: 0.0
      2030: 0.2011
      2035: 0.496
      2040: 0.7729
      2045: 1.0
  
  sector:
    aviation_demand_factor:
      2020: 1.0
      2025: 0.9361
      2030: 0.8558
      2035: 0.7713
      2040: 0.6948
      2045: 0.6909
  
  demand_modelling: 
    enable: true
    voll: true
    elastic_capa: false
    elastic_all: false
    elastic_pwl: false # false, default, lower, higher
    voll_price: 2000 # €/MWh

  coal_generation_ban:
    DE: 2050

  nuclear_generation_ban:
    DE: 2050

  electricity:
    H2_plants_DE:
      enable: false
      start: 2030 # should be < force
      force: 2035
      cost_factor: 0.15 # repurposing cost of OCGT gas to H2 in % investment cost in EUR/MW source: Christidis et al (2023) - H2-Ready-Gaskraftwerke, Table 3 https://reiner-lemoine-institut.de/wp-content/uploads/2023/11/RLI-Studie-H2-ready_DE.pdf
      efficiency_loss: 0.05


